  <rect x="262" y="470" width="276" height="250" rx="6" fill="url(#label)"/>
  <ellipse cx="400" cy="595" rx="118" ry="104" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <ellipse cx="400" cy="595" rx="108" ry="94" fill="none" stroke="url(#gold)" stroke-width="1"/>
  <text x="400" y="548" text-anchor="middle" font-family="Cinzel, serif" font-size="13" letter-spacing="3.5" fill="#d8bb72">MARMELLATA</text>
  <text x="400" y="602" text-anchor="middle" font-family="Cinzel, serif" font-size="34" font-weight="600" letter-spacing="3" fill="url(#gold)">GINCANA</text>
  <path d="M332 618 H468" stroke="#c2a55a" stroke-width="1"/>
  <text x="400" y="644" text-anchor="middle" font-family="Cinzel, serif" font-size="12" letter-spacing="3" fill="#d8bb72">LAGO SEBINO</text>
  <text x="400" y="668" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="16" fill="#e8dcb8">220 g</text>
  <!-- filo dello spago -->
  <path d="M252 306 C300 326 500 326 548 306" fill="none" stroke="#d8bb72" stroke-opacity=".7" stroke-width="1.6"/>
  <path d="M520 316 C540 360 528 392 506 410" fill="none" stroke="#d8bb72" stroke-opacity=".7" stroke-width="1.4"/>
  <rect x="482" y="404" width="44" height="58" rx="4" fill="#f4f0e6" transform="rotate(-12 504 433)"/>
  <text x="504" y="440" text-anchor="middle" font-family="Pinyon Script, cursive" font-size="20" fill="#2c382c" transform="rotate(-12 504 433)">gin</text>
</svg>
