  <path d="M0 860 H800 V1000 H0 Z" fill="#141813"/>
  <path d="M0 860 H800" stroke="#c2a55a" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M60 900 C200 880 260 960 420 930 S700 900 790 950" fill="none" stroke="#f4f0e6" stroke-opacity=".06" stroke-width="2"/>
  <path d="M0 950 C140 930 300 990 520 965" fill="none" stroke="#f4f0e6" stroke-opacity=".05" stroke-width="1.5"/>
  <!-- ombra -->
  <ellipse cx="400" cy="858" rx="200" ry="16" fill="#000" opacity=".55"/>
  <!-- marmellata dentro -->
  <g clip-path="url(#jar)">
