    <path d="M230 384 Q320 372 400 384 T570 380 V392 H230 Z" fill="#d07a30" opacity=".6"/>
    <circle cx="300" cy="700" r="5" fill="#e09a4a" opacity=".35"/>
    <circle cx="470" cy="610" r="4" fill="#e09a4a" opacity=".3"/>
    <circle cx="420" cy="770" r="6" fill="#e09a4a" opacity=".25"/>
    <rect x="230" y="296" width="340" height="560" fill="url(#glass)"/>
  </g>
  <!-- vetro -->
  <path d="M238 330 Q238 300 268 296 H532 Q562 300 562 330 V800 Q562 846 516 846 H284 Q238 846 238 800 Z" fill="none" stroke="#f4f0e6" stroke-opacity=".38" stroke-width="2"/>
  <path d="M262 340 V780" stroke="#fff" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>
  <!-- coperchio oro -->
  <rect x="250" y="226" width="300" height="78" rx="10" fill="url(#gold)"/>
  <g stroke="#6f5a26" stroke-opacity=".45" stroke-width="2">
    <path d="M270 232 V298"/><path d="M290 232 V298"/><path d="M310 232 V298"/><path d="M330 232 V298"/><path d="M350 232 V298"/><path d="M370 232 V298"/><path d="M390 232 V298"/><path d="M410 232 V298"/><path d="M430 232 V298"/><path d="M450 232 V298"/><path d="M470 232 V298"/><path d="M490 232 V298"/><path d="M510 232 V298"/><path d="M530 232 V298"/>
  </g>
  <rect x="250" y="226" width="300" height="12" rx="6" fill="#fff4d2" opacity=".45"/>
