<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Marmellata Gincana, barattolo da 220 g">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1d261d"/>
      <stop offset="0.6" stop-color="#121812"/>
      <stop offset="1" stop-color="#0b0f0b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d7334"/>
      <stop offset="0.32" stop-color="#c2a55a"/>
      <stop offset="0.5" stop-color="#fff1c8"/>
      <stop offset="0.68" stop-color="#d8bb72"/>
      <stop offset="1" stop-color="#8d7334"/>
    </linearGradient>
    <linearGradient id="jam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8601f"/>
      <stop offset="0.55" stop-color="#8a3d14"/>
      <stop offset="1" stop-color="#5a250b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.92" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34433a"/>
      <stop offset="1" stop-color="#243026"/>
    </linearGradient>
    <clipPath id="jar"><path d="M238 330 Q238 300 268 296 H532 Q562 300 562 330 V800 Q562 846 516 846 H284 Q238 846 238 800 Z"/></clipPath>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
